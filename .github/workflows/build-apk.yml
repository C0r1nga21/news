name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Cordova
      run: npm install -g cordova

    - name: Verificar arquivos do repositorio
      run: |
        echo "=== Conteudo do repositorio ==="
        ls -la
        if [ ! -d "www" ]; then
          echo "ERRO CRITICO: A pasta 'www' nao existe na raiz do seu repositorio!"
          exit 1
        fi

    - name: Criar Projeto Cordova e Compilar
      run: |
        rm -rf app_build
        cordova create app_build com.newspush.app "News Push"
        
        # Limpa o www padrao do Cordova e copia o seu site
        rm -rf app_build/www/*
        cp -r www/* app_build/www/
        
        cd app_build
        cordova platform add android
        cordova build android --debug

    - name: Enviar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: News-Push-APK
        path: |
          app_build/platforms/android/app/build/outputs/apk/debug/*.apk
          **/*.apk
        if-no-files-found: error
