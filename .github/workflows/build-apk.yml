name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configurar Java / JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar Cordova
      run: npm install -g cordova

    - name: Criar Projeto e Gerar APK
      run: |
        # Criar projeto Cordova
        cordova create appComHtml com.newspush.app "News Push"
        
        # Copiar pasta www
        cp -r www/* appComHtml/www/
        
        # Garantir config.xml dentro da raiz do app
        if [ -f www/config.xml ]; then
          cp www/config.xml appComHtml/config.xml
        fi
        
        cd appComHtml
        
        # Adicionar plataforma Android
        cordova platform add android
        
        # Executar Build
        cordova build android --verbose

    - name: Localizar APKs
      run: |
        echo "=== Arquivos APK Gerados ==="
        find appComHtml -type f -name "*.apk"

    - name: Publicar Artefato APK
      uses: actions/upload-artifact@v4
      with:
        name: News-Push-APK
        path: appComHtml/platforms/android/app/build/outputs/apk/debug/*.apk
